version: "2"
linters:
  default: standard
  enable:
    - bidichk
    - contextcheck
    - decorder
    - exhaustive
    - fatcontext
    - gosec
    - govet
    - intrange
    - maintidx
    - modernize
    - noctx
    - prealloc
    - recvcheck
    - sloglint
    - usestdlibvars
  settings:
    recvcheck:
      disable-builtin: false
      exclusions:
        - "*.TableName"
formatters:
  enable:
    - goimports
